services:
  frontend:
    image: ${REGISTRY:-192.168.0.189:5000}/maria-writer:latest
    ports:
      - "${FRONTEND_PORT:-8084}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: ${REGISTRY:-192.168.0.189:5000}/maria-writer-backend:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://${DB_USER:-maria_user}:${DB_PASSWORD}@db:3306/${DB_NAME:-maria_writer}
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  db:
    image: mariadb:11
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-maria_writer}
      - MYSQL_USER=${DB_USER:-maria_user}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /mnt/user/appdata/maria-writer/db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
